<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель сбора данных</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            width: 400px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 25px;
        }
        a.btn {
            display: block;
            background-color: #3b82f6;
            color: white;
            text-decoration: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        a.btn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Панель сбора данных</h1>
        <a href="/api/download-report" class="btn">Скачать сводный отчет (Excel)</a>
    </div>

</body>
</html>
