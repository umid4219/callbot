<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель сбора данных</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            width: 400px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 25px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
        #status {
            margin-top: 20px;
            padding: 10px;
            background-color: #334155;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Панель сбора данных</h1>
        <div class="btn-group">
            <button onclick="downloadReport('day')">Собрать за весь день</button>
            <button onclick="downloadReport('hour')">Собрать за последний час</button>
        </div>
        <div id="status">Генерация отчета...</div>
    </div>

    <script>
        function downloadReport(actionType) {
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'block';
            statusDiv.innerText = actionType === 'day' 
                ? 'Сбор данных за весь день...' 
                : 'Сбор данных за последний час...';

            fetch('/api/download-report', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ action: actionType })
            })
            .then(response => {
                if (!response.ok) throw new Error('Ошибка при скачивании');
                return response.blob();
            })
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Call_Report_${actionType}.xlsx`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                statusDiv.innerText = 'Всё успешно выгружено и сохранено!';
            })
            .catch(error => {
                statusDiv.innerText = 'Произошла ошибка при выгрузке.';
                console.error(error);
            });
        }
    </script>

</body>
</html>
